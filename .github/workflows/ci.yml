name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libglib2.0-dev pkg-config

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.29'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -v

      - name: Compile Python files
        run: uv run --frozen python -m compileall -q src tests tools

  package:
    name: Package and operations
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libglib2.0-dev pkg-config

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.11.29'
          python-version: '3.12'
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install project
        run: uv sync --frozen

      - name: Verify wheel installation
        run: uv run --frozen python tests/wheel_smoke.py

      - name: Verify systemd unit
        run: make test-systemd

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macropad-distributions
          path: dist/*
          if-no-files-found: error
