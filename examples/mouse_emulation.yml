device: SEMICO USB Keyboard
bindings:
  KEY_CAPSLOCK:
    down: xdotool click 3 # Mouse right click
  KEY_A:
    down: xdotool click --repeat 1 --delay 50 4 # Scroll up
  KEY_S:
    down: xdotool mousemove_relative -- -15 0 # Mouse left
  KEY_D:
    down: xdotool mousemove_relative -- 0 -15 # Mouse up
  KEY_F:
    down: xdotool mousemove_relative -- 0 15 # Mouse down
  KEY_G:
    down: xdotool mousemove_relative -- 15 0 # Mouse right
  KEY_B:
    down: xdotool click --repeat 1 --delay 50 5 # Scroll down
  KEY_LEFTALT:
    down: xdotool click 2 # Mouse middle click
  KEY_SPACE:
    down: xdotool click 1 # Mouse left click
