device: Generic USB Keyboard
version: 0
handlers:
  - name: command
    config:
      dry_run: true
      binds:
        KEY_KP1:
          up:
            - google-chrome https://google.com
          down:
            - google-chrome https://youtube.com
        KEY_KP2:
          up:
            - xdotool key super+alt+o
