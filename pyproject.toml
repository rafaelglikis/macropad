[project]
name = "poor-mans-macropad"
version = "0.1.0"
description = "Turn every keyboard into a Macropad"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rafael Glikis", email = "rafaelglikis@gmail.com" },
]
keywords = ["evdev", "keyboard", "linux", "macropad"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "dbus-python>=1.3.2",
    "evdev>=1.6.1",
    "notify2>=0.3.1",
    "pyyaml>=6.0.1",
    "watchdog>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
]

[project.scripts]
macropad = "macropad.cli:main"

[project.urls]
Homepage = "https://github.com/rafaelglikis/macropad"
Issues = "https://github.com/rafaelglikis/macropad/issues"
Repository = "https://github.com/rafaelglikis/macropad"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "macropad"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "single"
