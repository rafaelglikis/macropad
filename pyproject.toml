[project]
name = "macropad"
version = "0.1.0"
description = "Turn every keyboard into a Macropad"
requires-python = ">=3.10"
dependencies = [
    "argcomplete>=3.1.4",
    "dbus-python>=1.3.2",
    "evdev>=1.6.1",
    "notify2>=0.3.1",
    "pyyaml>=6.0.1",
    "watchdog>=3.0.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
]

[project.scripts]
macropad = "macropad.cli:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "single"
